
name: Inspect Land Savvy public form

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect website
        run: python inspect_site.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land-savvy-form-inspection
          path: output/inspection/
          retention-days: 3
